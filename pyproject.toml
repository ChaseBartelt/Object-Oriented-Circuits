[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electric-circuits-calculator"
version = "1.0.0"
description = "Editor, schematic renderer, and circuit analysis calculator"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7", "numpy>=1.26,<3", "scipy>=1.11,<2", "sympy>=1.12,<2"]

[project.gui-scripts]
electric-circuits = "circuitlab.gui:main"

[tool.setuptools]
packages = ["circuitlab"]

[tool.setuptools.package-data]
circuitlab = ["libraries/chips/*.md", "libraries/chips/*/*.ckt"]
